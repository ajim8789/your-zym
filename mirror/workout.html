<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout — Arnold's Gym</title>
  <meta name="description" content="Step-by-step workout guide at Arnold's Gym, Giridih." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
/* ============================================================
   Arnold's Gym v2 — dark theme stylesheet
   Palette:  bg #0b0b0f · accent gradient #ff3131 → #ff7a00
   Fonts:    Oswald (headings) · Poppins (body)
   ============================================================ */

:root {
  --bg: #0b0b0f;
  --bg-2: #121218;
  --bg-3: #18181f;
  --card: rgba(255, 255, 255, 0.04);
  --border: rgba(255, 255, 255, 0.09);
  --text: #f4f4f6;
  --muted: #a7a7b3;
  --red: #ff3131;
  --orange: #ff7a00;
  --grad: linear-gradient(135deg, #ff3131, #ff7a00);
  --green: #22c55e;
  --amber: #f59e0b;
  --radius: 16px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Poppins", system-ui, sans-serif;
  line-height: 1.65;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

h1, h2, h3, .font-head {
  font-family: "Oswald", "Poppins", sans-serif;
  letter-spacing: 0.5px;
}

.container { width: min(1180px, 92%); margin: 0 auto; }
section { padding: 84px 0; }

.sec-title {
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 8px;
}
.sec-title .accent {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sec-sub {
  text-align: center;
  color: var(--muted);
  max-width: 620px;
  margin: 0 auto 44px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 30px;
  border-radius: 999px;
  font-weight: 600; font-size: 0.95rem;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
.btn-grad {
  background: var(--grad); color: #fff;
  box-shadow: 0 10px 28px rgba(255, 49, 49, 0.35);
}
.btn-grad:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(255, 49, 49, 0.5); }
.btn-ghost {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--border);
  backdrop-filter: blur(8px);
}
.btn-ghost:hover { transform: translateY(-3px); border-color: var(--orange); }
.btn-whatsapp { background: #1faa53; color: #fff; }
.btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(31, 170, 83, 0.45); }
.btn-sm { padding: 9px 18px; font-size: 0.82rem; }

/* ---------- navbar ---------- */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  transition: background 0.3s ease, box-shadow 0.3s ease, padding 0.3s ease;
  padding: 18px 0;
}
.navbar .nav-inner {
  width: min(1180px, 92%); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar.scrolled {
  background: rgba(11, 11, 15, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  padding: 12px 0;
}
.logo {
  font-family: "Oswald", sans-serif;
  font-size: 1.45rem; font-weight: 700; text-transform: uppercase;
}
.logo .accent {
  background: var(--grad); -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
.nav-links a { font-size: 0.93rem; color: var(--muted); font-weight: 500; transition: color 0.2s; }
.nav-links a:hover, .nav-links a.active { color: #fff; }
.nav-cta { padding: 10px 22px; }
.hamburger { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

/* ---------- hero ---------- */
.hero {
  min-height: 100svh;
  display: flex; align-items: center;
  position: relative; overflow: hidden;
  background:
    radial-gradient(700px 380px at 85% 15%, rgba(255, 122, 0, 0.16), transparent 60%),
    radial-gradient(800px 460px at 8% 88%, rgba(255, 49, 49, 0.18), transparent 60%),
    var(--bg);
  padding-top: 110px;
}
/* floating shapes */
.blob {
  position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5;
  animation: float 11s ease-in-out infinite; pointer-events: none;
}
.blob-1 { width: 340px; height: 340px; background: #ff3131; top: -80px; right: 8%; animation-delay: 0s; }
.blob-2 { width: 260px; height: 260px; background: #ff7a00; bottom: 6%; left: -60px; animation-delay: 2.5s; }
.blob-3 { width: 190px; height: 190px; background: #7a1fff; top: 46%; right: 30%; animation-delay: 5s; opacity: 0.35; }
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-34px, 44px) scale(1.08); }
}
.hero-grid { position: relative; z-index: 2; text-align: center; max-width: 880px; margin: 0 auto; }
.hero-kicker {
  display: inline-block; padding: 8px 20px; border-radius: 999px;
  background: rgba(255, 122, 0, 0.1); border: 1px solid rgba(255, 122, 0, 0.35);
  color: var(--orange); font-size: 0.8rem; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: 22px;
}
.hero h1 {
  font-size: clamp(2.2rem, 7vw, 5rem);
  line-height: 1.08; text-transform: uppercase; margin-bottom: 10px;
}
.hero h1 .typed-wrap { color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text; }
.hero p.lead { color: var(--muted); font-size: 1.05rem; max-width: 620px; margin: 18px auto 34px; }
.hero-cta { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.scroll-hint { margin-top: 54px; color: var(--muted); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
.scroll-hint i { display: block; font-size: 1.3rem; margin-top: 8px; animation: bounce 1.8s infinite; color: var(--orange); }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

/* ---------- stats band ---------- */
.stats-band {
  background: var(--bg-2);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 54px 0;
}
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center;
}
.stat .num {
  font-family: "Oswald", sans-serif; font-size: clamp(2rem, 4.5vw, 3.1rem);
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.stat .lbl { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; }

/* ---------- cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 26px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  position: relative; overflow: hidden;
}
.card:hover { transform: translateY(-8px); border-color: rgba(255, 122, 0, 0.55); box-shadow: var(--shadow); }
.card .icon-ring {
  width: 62px; height: 62px; border-radius: 18px;
  display: grid; place-items: center; font-size: 1.6rem; color: #fff;
  background: var(--grad); margin-bottom: 18px;
  box-shadow: 0 8px 22px rgba(255, 49, 49, 0.4);
}
.card h3 { font-size: 1.2rem; margin-bottom: 8px; text-transform: uppercase; }
.card p { color: var(--muted); font-size: 0.92rem; }

/* program cards with zoom images */
.program-card { padding: 0; min-height: 340px; display: flex; align-items: flex-end; }
.program-card .bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: transform 0.6s ease;
}
.program-card:hover .bg { transform: scale(1.1); }
.program-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(5, 5, 8, 0.95) 8%, rgba(5, 5, 8, 0.25) 55%, transparent);
}
.program-card .info { position: relative; z-index: 2; padding: 26px; }
.program-card .info h3 { font-size: 1.35rem; }
.program-card .info p { font-size: 0.88rem; }
.program-card .go {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  color: var(--orange); font-weight: 600; font-size: 0.88rem;
}

/* ---------- classes by age ---------- */
.age-card { text-align: center; }
.age-card .age {
  font-family: "Oswald", sans-serif; font-size: 2.2rem; color: #fff; margin-bottom: 6px;
}
.age-card .age span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.age-card ul { list-style: none; margin-top: 14px; color: var(--muted); font-size: 0.9rem; }
.age-card ul li { padding: 7px 0; border-top: 1px dashed var(--border); }
.age-card ul li i { color: var(--green); margin-right: 8px; }

/* ---------- pricing ---------- */
.pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; align-items: stretch; }
.price-card { text-align: center; display: flex; flex-direction: column; }
.price-card.popular {
  border: 1px solid rgba(255, 122, 0, 0.6);
  background: linear-gradient(180deg, rgba(255, 49, 49, 0.12), rgba(255, 122, 0, 0.06));
  transform: scale(1.04);
}
.price-card.popular:hover { transform: scale(1.04) translateY(-8px); }
.plan-tag {
  align-self: center; font-size: 0.72rem; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; background: var(--grad); color: #fff;
  padding: 6px 18px; border-radius: 999px; margin-bottom: 14px;
}
.price { font-family: "Oswald", sans-serif; font-size: 2.8rem; margin: 6px 0; }
.price small { font-size: 1rem; color: var(--muted); font-family: "Poppins", sans-serif; }
.price-card ul { list-style: none; margin: 18px 0 26px; color: var(--muted); font-size: 0.92rem; flex: 1; }
.price-card ul li { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.price-card ul li i { color: var(--green); margin-right: 8px; }
.price-card ul li.off { opacity: 0.45; }
.price-card ul li.off i { color: var(--red); }

/* ---------- BMI widget ---------- */
.bmi-box {
  max-width: 680px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 40px 36px; backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.bmi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
.field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 13px 16px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 0.95rem; outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); }
.field select option { background: #15151c; }
.bmi-result {
  margin-top: 22px; text-align: center; padding: 20px; border-radius: 14px;
  background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border);
}
.bmi-result .val { font-family: "Oswald", sans-serif; font-size: 2.4rem; }
.bmi-result .cat { font-weight: 600; margin-top: 4px; }
.bmi-bar { height: 10px; border-radius: 999px; margin: 14px 0 6px;
  background: linear-gradient(90deg, #38bdf8 0 20%, #22c55e 20% 40%, #f59e0b 40% 60%, #ff3131 60% 100%); position: relative; }
.bmi-marker { position: absolute; top: -6px; width: 4px; height: 22px; background: #fff; border-radius: 2px; transition: left 0.5s ease; }

/* ---------- trainers ---------- */
.trainer-card { text-align: center; padding: 28px 22px; }
.trainer-photo {
  width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 18px;
  object-fit: cover; border: 3px solid transparent;
  background: var(--grad) border-box;
  box-shadow: 0 10px 30px rgba(255, 49, 49, 0.35);
}
.trainer-avatar {
  width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 18px;
  display: grid; place-items: center;
  font-family: "Oswald", sans-serif; font-size: 3rem; color: #fff;
  background: var(--grad);
  box-shadow: 0 10px 30px rgba(255, 49, 49, 0.35);
}
.trainer-role { color: var(--orange); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 2px; margin: 4px 0 10px; }
.trainer-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* ---------- testimonials ---------- */
.testi-wrap { max-width: 760px; margin: 0 auto; position: relative; }
.testi-track { position: relative; min-height: 230px; }
.testi {
  position: absolute; inset: 0; opacity: 0; transform: translateY(18px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  text-align: center; padding: 36px 30px;
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  pointer-events: none;
}
.testi.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
.testi .stars { color: var(--amber); letter-spacing: 4px; margin-bottom: 12px; }
.testi p { color: var(--muted); font-style: italic; }
.testi .who { margin-top: 16px; font-weight: 600; }
.testi .who small { display: block; color: var(--orange); font-weight: 400; font-size: 0.8rem; }
.testi-dots { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
.testi-dots button {
  width: 10px; height: 10px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255, 255, 255, 0.2); transition: background 0.3s, transform 0.3s;
}
.testi-dots button.active { background: var(--grad); transform: scale(1.35); }

/* ---------- contact ---------- */
.contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 34px; align-items: start; }
.contact-info .row {
  display: flex; gap: 16px; align-items: flex-start;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; margin-bottom: 14px;
}
.contact-info .row i {
  width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; background: var(--grad); color: #fff; font-size: 1.1rem;
}
.contact-info .row .h { font-weight: 600; font-size: 0.95rem; }
.contact-info .row .s { color: var(--muted); font-size: 0.88rem; word-break: break-word; }
.contact-form {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 36px 30px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
.form-note { font-size: 0.8rem; color: var(--muted); margin-top: 14px; }
.form-note i { color: var(--green); }

/* ---------- footer ---------- */
footer {
  border-top: 1px solid var(--border); background: var(--bg-2);
  padding: 54px 0 26px; margin-top: 40px;
}
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 30px; margin-bottom: 36px; }
.footer-grid h4 { margin-bottom: 14px; text-transform: uppercase; font-size: 0.95rem; }
.footer-grid ul { list-style: none; }
.footer-grid ul li { margin-bottom: 9px; }
.footer-grid ul a, .footer-grid p { color: var(--muted); font-size: 0.9rem; }
.footer-grid ul a:hover { color: var(--orange); }
.socials { display: flex; gap: 12px; margin-top: 16px; }
.socials a {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
  transition: background 0.25s, transform 0.25s;
}
.socials a:hover { background: var(--grad); transform: translateY(-3px); }
.footer-bottom {
  border-top: 1px solid var(--border); padding-top: 22px;
  display: flex; justify-content: space-between; align-items: center;
  color: var(--muted); font-size: 0.82rem; flex-wrap: wrap; gap: 10px;
}

/* ---------- reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: none; }
.reveal-d1 { transition-delay: 0.1s; } .reveal-d2 { transition-delay: 0.2s; } .reveal-d3 { transition-delay: 0.3s; }

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 26px; right: 26px; z-index: 9999;
  background: #15151c; border: 1px solid var(--border); border-left: 4px solid var(--green);
  color: var(--text); padding: 15px 20px; border-radius: 12px; font-size: 0.9rem;
  box-shadow: var(--shadow); max-width: min(360px, 86vw);
  transform: translateY(140%); transition: transform 0.4s ease;
}
.toast.show { transform: none; }
.toast.error { border-left-color: var(--red); }
.toast i { margin-right: 9px; }
.toast.ok i { color: var(--green); } .toast.error i { color: var(--red); }

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(5, 5, 8, 0.7); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(520px, 100%); max-height: 90vh; overflow: auto;
  background: var(--bg-3); border: 1px solid var(--border); border-radius: 20px;
  padding: 30px 28px; box-shadow: var(--shadow);
}
.modal h3 { margin-bottom: 18px; }
.modal .form-grid { margin-bottom: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .contact-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 30px; }
}
@media (max-width: 1024px) {
  /* tablet + phone: hamburger menu (6 links + CTA fit nahi hote) */
  .nav-links {
    position: fixed; inset: 0 0 0 30%;
    background: rgba(11, 11, 15, 0.97); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    flex-direction: column; justify-content: center; gap: 30px;
    transform: translateX(100%); transition: transform 0.35s ease;
    z-index: 100;
  }
  .nav-links.open { transform: none; }
  .nav-links a { font-size: 1.15rem; }
  .hamburger { display: block; z-index: 101; position: relative; }
}
@media (max-width: 720px) {
  section { padding: 64px 0; }
  .bmi-row, .form-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
  .price-card.popular { transform: none; }
  .price-card.popular:hover { transform: translateY(-8px); }
  /* iOS auto-zoom fix: input 16px se chhota nahi */
  .field input, .field select, .field textarea { font-size: 16px; }
  .modal { padding: 24px 20px; }
  .testi-track { min-height: 340px; }
  .testi { padding: 28px 20px; }
}
@media (max-width: 480px) {
  /* compact phone view: sab kuchh ek screen me fit ho */
  section { padding: 44px 0; }
  .container { width: min(1180px, 94%); }
  .sec-title { font-size: 1.55rem; }
  .sec-sub { font-size: .88rem; margin-bottom: 30px; }
  .hero { padding-top: 96px; }
  .hero h1 { font-size: 2rem; }
  .hero p.lead { font-size: .92rem; margin-bottom: 26px; }
  .hero-kicker { font-size: .68rem; padding: 6px 16px; margin-bottom: 16px; }
  .hero-cta { gap: 10px; }
  .hero-cta .btn { width: 100%; justify-content: center; padding: 12px 20px; font-size: .86rem; }
  .scroll-hint { margin-top: 36px; }
  .bmi-box { padding: 26px 18px; }
  .contact-form { padding: 26px 18px; }
  .card { padding: 24px 18px; }
  .card h3 { font-size: 1.05rem; }
  .card .icon-ring { width: 52px; height: 52px; font-size: 1.3rem; margin-bottom: 14px; }
  .stats-grid { gap: 14px; }
  .stat .lbl { font-size: 0.7rem; }
  .price { font-size: 2.1rem; }
  .price-card ul { font-size: .85rem; }
  .trainer-photo, .trainer-avatar { width: 118px; height: 118px; }
  .trainer-card { padding: 24px 16px; }
  .testi { font-size: .88rem; }
  .mcard { padding: 18px 14px; }
  .mcard-months { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .mcard-gym { font-size: 1.1rem; }
  .mcard-name { font-size: 1.1rem; }
  .footer-grid { gap: 22px; }
  .footer-bottom { justify-content: center; text-align: center; }
  .toast { bottom: 14px; right: 14px; left: 14px; max-width: none; font-size: .82rem; }
}

/* ---------- v2: announcement bar ---------- */
.announce-bar {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 10px 18px; font-size: .82rem; font-weight: 600; text-align: center;

  <script>
/* ============================================================
   assets/sheets.js — Data API layer  [v2]
   ------------------------------------------------------------
   Every data operation in the site goes through this file.

   SHEETS MODE  : if WEB_APP_URL is set in config.js, calls the
                  Google Apps Script Web App (Code.gs router).
   DEMO MODE    : if WEB_APP_URL is empty, uses a localStorage
                  backed store with the same function signatures,
                  so the UI works identically from file:// too.

   Convention: every API function resolves to { ok, data, error }.
   Actions are matched 1:1 by Code.gs doGet/doPost router.
   ============================================================ */

/* global WEB_APP_URL */

const ApiMode = { sheets: !!WEB_APP_URL, demo: !WEB_APP_URL };
const SYNC = { online: false, checkedAt: null }; // filled by ping()

/* ------------------ HTTP helpers (Sheets mode) ------------------ */
/* We POST with Content-Type: text/plain so Apps Script answers
   without triggering a CORS preflight (simple request). */

async function apiGet(action, params = {}) {
  if (ApiMode.demo) return demoGet(action, params);
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${WEB_APP_URL}?${qs}`, { method: "GET" });
  return res.json();
}

async function apiPost(action, payload = {}) {
  if (ApiMode.demo) return demoPost(action, payload);
  const res = await fetch(WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, ...payload }),
  });
  return res.json();
}

/* ============================================================
   DEFAULT WEBSITE CONTENT (also used as demo seeds)
   Shared by https://muse.ai/files/1360301033830820/1872163737463658/rnxloox1wzwol1sei58xtuti/index.html (app.js) and admin panel (admin.js).
   ============================================================ */
const SITE_DEFAULTS = {
  hero_line1: "Win That Battle",
  hero_line2: "In Your Mind",
  hero_typed: "Build Muscle.,Burn Fat.,Stay Disciplined.,Win The Battle In Your Mind.",

/* ============================================================
   GYM NAME — single branding source (Settings → Gym Name)
   ------------------------------------------------------------
   gymNameOf(content)  → effective gym name from site content
   applyGymName(name)  → rewrites every "Arnold's Gym" occurrence
                         in title, text nodes and meta tags.
   Call it after dynamic content has rendered on each page.
   ============================================================ */
const DEFAULT_GYM_NAME = "Arnold's Gym";

const escBr = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function gymNameOf(content) {
  const n = String((content && content.gym_name) || "").trim();
  return n || DEFAULT_GYM_NAME;
}

function applyGymName(name) {
  name = String(name || "").trim();
  if (!name || name === DEFAULT_GYM_NAME) return;
  if (document.title) document.title = document.title.split(DEFAULT_GYM_NAME).join(name);
  if (document.body) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: (node) => {
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        const tag = p.tagName;
        if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "INPUT") return NodeFilter.FILTER_REJECT;
        return node.nodeValue.indexOf(DEFAULT_GYM_NAME) !== -1 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => { node.nodeValue = node.nodeValue.split(DEFAULT_GYM_NAME).join(name); });
  }
  document.querySelectorAll('meta[name="description"], meta[property="og:description"]').forEach((m) => {
    const c = m.getAttribute("content") || "";
    if (c.indexOf(DEFAULT_GYM_NAME) !== -1) m.setAttribute("content", c.split(DEFAULT_GYM_NAME).join(name));
  });
  /* logos split the name across nodes: "Arnold's " + accented "Gym" */
  document.querySelectorAll(".logo").forEach((logo) => {
    const norm = logo.textContent.replace(/\s+/g, " ").trim();
    if (norm !== DEFAULT_GYM_NAME && norm !== name) return;
    const words = String(name).split(/\s+/).filter(Boolean);
    const last = words.pop() || name;
    const first = words.join(" ");
    const span = logo.querySelector("span");
    const cls = span && span.getAttribute("class") ? ` class="${span.getAttribute("class")}"` : "";
    const style = span && span.getAttribute("style") ? ` style="${span.getAttribute("style")}"` : "";
    logo.innerHTML = `${escBr(first + (first ? " " : ""))}<span${cls}${style}>${escBr(last)}</span>`;
  });
}

/* ------------------ Public API (same in both modes) ------------------ */
const api = {
  /* connection check */
  ping: () => apiGet("ping"),

  /* members */
  listMembers: () => apiGet("listMembers"),
  addMember: (m) => apiPost("addMember", { member: m }),
  updateMember: (id, m) => apiPost("updateMember", { id, member: m }),
  deleteMember: (id) => apiPost("deleteMember", { id }),
  findMember: (mobile) => apiGet("findMember", { mobile }),

  /* staff */
  listStaff: () => apiGet("listStaff"),
  addStaff: (s) => apiPost("addStaff", { staff: s }),
  updateStaff: (id, s) => apiPost("updateStaff", { id, staff: s }),
  deleteStaff: (id) => apiPost("deleteStaff", { id }),

  /* attendance */
  listAttendance: (date) => apiGet("listAttendance", { date }),
  saveAttendance: (date, rows) => apiPost("saveAttendance", { date, rows }),

  /* public forms */
  register: (r) => apiPost("register", { registration: r }),
  contact: (c) => apiPost("contact", { message: c }),

  /* ---- v2: generic website-content tabs ---- */
  readTab: (tab) => apiGet("readTab", { tab }),
  appendTabRow: (tab, row) => apiPost("appendTabRow", { tab, row }),
  updateTabRow: (tab, id, patch) => apiPost("updateTabRow", { tab, id, patch }),
  deleteTabRow: (tab, id) => apiPost("deleteTabRow", { tab, id }),

  /* site content (key/value) with defaults merged in */
  getSiteContent: async () => {
    const map = { ...SITE_DEFAULTS };
    try {
      const r = await api.readTab("SiteContent");
      ((r && r.ok && r.data) || []).forEach((x) => {
        if (x && x.key) map[x.key] = x.value ?? "";
      });
    } catch (e) { /* defaults stand */ }
    return map;
  },
  /* insert or update one content key */
  upsertSiteContent: async (key, value) => {
    const r = await api.readTab("SiteContent");
    const rows = (r && r.ok && r.data) || [];
    const ex = rows.find((x) => x.key === key);
    if (ex) return api.updateTabRow("SiteContent", ex.id, { value });
    return api.appendTabRow("SiteContent", { key, value });
  },
};

/* ------------------ Sync badge helper ------------------ */
/* Returns true if the Sheets backend answered. Safe to call
   anywhere; never throws. */
async function checkConnection() {
  try {
    const r = await api.ping();
    SYNC.online = !!(r && r.ok && r.data && r.data.service === "gym-api");
  } catch (e) {
    SYNC.online = false;
  }
  SYNC.checkedAt = new Date();
  document.dispatchEvent(new CustomEvent("gym:sync", { detail: { ...SYNC } }));
  return SYNC.online;
}

/* ============================================================
   DEMO MODE STORE (localStorage)
   ============================================================ */
const LS_KEY = "gym_v2_demo_db_v2";

/* tab name → demo-db collection key */
const DEMO_TABS = { SiteContent: "siteContent", Plans: "plans", Trainers: "trainers", Workouts: "workouts" };

function demoSeed() {
  return {
    members: [
      { id: "m-seed-1", name: "Ravi Verma", email: "ravi@example.com", mobile: "9876543210", plan: "Monthly", payment: 800, validity: "2026-11-05", created: "2026-10-06T08:00:00" },
      { id: "m-seed-2", name: "Suresh Yadav", email: "suresh@example.com", mobile: "9876543211", plan: "Quarterly", payment: 2000, validity: "2027-01-06", created: "2026-10-06T08:00:00" },
      { id: "m-seed-3", name: "Pooja Kumari", email: "pooja@example.com", mobile: "9876543212", plan: "Yearly", payment: 7000, validity: "2026-10-12", created: "2026-10-06T08:00:00" },
    ],
    staff: [
      { id: "s-seed-1", name: "Rahul Sharma", role: "Trainer", salary: 25000 },
      { id: "s-seed-2", name: "Amit Kumar", role: "Manager", salary: 35000 },
      { id: "s-seed-3", name: "Rohit Singh", role: "Trainer", salary: 24000 },
    ],
    attendance: {}, // { "2026-10-06": [ {name, status}, ... ] }
    registrations: [],
    contacts: [],
    /* --- v2 website content seeds --- */
    siteContent: Object.entries(SITE_DEFAULTS).map(([key, value], i) => ({ id: "sc-seed-" + i, key, value })),
    plans: DEMO_PLANS.map((p) => ({ ...p })),
    trainers: DEMO_TRAINERS.map((t) => ({ ...t })),
    workouts: DEMO_WORKOUTS.map((w) => ({ ...w })),
  };
}

function demoDb() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through to seed */ }
  const seed = demoSeed();
  localStorage.setItem(LS_KEY, JSON.stringify(seed));
  return seed;
}

function demoSave(db) {
  localStorage.setItem(LS_KEY, JSON.stringify(db));
}

const uid = () => "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

function demoGet(action, params = {}) {
  const db = demoDb();
  switch (action) {
    case "ping": return Promise.resolve({ ok: true, data: { service: "gym-api-demo", message: "Demo mode (localStorage)" } });
    case "listMembers": return Promise.resolve({ ok: true, data: db.members });
    case "findMember": {
      const digits = String(params.mobile || "").replace(/\D/g, "").slice(-10);
      const hits = db.members.filter((m) => String(m.mobile || "").replace(/\D/g, "").slice(-10) === digits);
      hits.sort((a, b) => String(b.validity || "").localeCompare(String(a.validity || "")));
      const hit = hits[0];
      if (!hit) return Promise.resolve({ ok: false, error: "Member not found" });
      const { photo, ...rest } = hit;
      return Promise.resolve({ ok: true, data: rest });
    }
    case "listStaff": return Promise.resolve({ ok: true, data: db.staff });
    case "listAttendance":
      return Promise.resolve({ ok: true, data: db.attendance[params.date] || [] });
    case "readTab": {
      const col = DEMO_TABS[params.tab];
      if (!col) return Promise.resolve({ ok: false, error: "Unknown tab: " + params.tab });
      return Promise.resolve({ ok: true, data: db[col] || [] });
    }
    default: return Promise.resolve({ ok: false, error: "Unknown action: " + action });
  }
}

function demoPost(action, payload = {}) {
  const db = demoDb();
  const tabCol = (tab) => {
    const col = DEMO_TABS[tab];
    if (!col) return null;
    if (!db[col]) db[col] = [];
    return db[col];
  };
  switch (action) {
    case "addMember": {
      const member = { id: uid(), created: new Date().toISOString(), ...payload.member };
      db.members.push(member); demoSave(db);
      return Promise.resolve({ ok: true, data: member });
    }
    case "updateMember": {
      const i = db.members.findIndex((m) => m.id === payload.id);
      if (i < 0) return Promise.resolve({ ok: false, error: "Member not found" });
      db.members[i] = { ...db.members[i], ...payload.member }; demoSave(db);
      return Promise.resolve({ ok: true, data: db.members[i] });
    }
    case "deleteMember": {
      db.members = db.members.filter((m) => m.id !== payload.id); demoSave(db);
      return Promise.resolve({ ok: true, data: { id: payload.id } });
    }
    case "addStaff": {
      const staff = { id: uid(), ...payload.staff };
      db.staff.push(staff); demoSave(db);
      return Promise.resolve({ ok: true, data: staff });
    }
    case "updateStaff": {
      const i = db.staff.findIndex((s) => s.id === payload.id);
      if (i < 0) return Promise.resolve({ ok: false, error: "Staff not found" });
      db.staff[i] = { ...db.staff[i], ...payload.staff }; demoSave(db);
      return Promise.resolve({ ok: true, data: db.staff[i] });
    }
    case "deleteStaff": {
      db.staff = db.staff.filter((s) => s.id !== payload.id); demoSave(db);
      return Promise.resolve({ ok: true, data: { id: payload.id } });
    }
    case "saveAttendance": {
      db.attendance[payload.date] = payload.rows; demoSave(db);
      return Promise.resolve({ ok: true, data: { date: payload.date, count: payload.rows.length } });
    }
    case "register": {
      const r = { id: uid(), created: new Date().toISOString(), ...payload.registration };
      db.registrations.push(r); demoSave(db);
      return Promise.resolve({ ok: true, data: r });
    }
    case "contact": {
      const c = { id: uid(), created: new Date().toISOString(), ...payload.message };
      db.contacts.push(c); demoSave(db);
      return Promise.resolve({ ok: true, data: c });
    }
    /* --- v2 generic tab writers --- */
    case "appendTabRow": {
      const col = tabCol(payload.tab);
      if (!col) return Promise.resolve({ ok: false, error: "Unknown tab: " + payload.tab });
      const row = { id: uid(), ...(payload.row || {}) };
      col.push(row); demoSave(db);
      return Promise.resolve({ ok: true, data: row });
    }
    case "updateTabRow": {
      const col = tabCol(payload.tab);
      if (!col) return Promise.resolve({ ok: false, error: "Unknown tab: " + payload.tab });
      const i = col.findIndex((x) => String(x.id) === String(payload.id));
      if (i < 0) return Promise.resolve({ ok: false, error: "Record not found" });
      col[i] = { ...col[i], ...(payload.patch || {}) }; demoSave(db);
      return Promise.resolve({ ok: true, data: col[i] });
    }
    case "deleteTabRow": {
      const col = tabCol(payload.tab);
      if (!col) return Promise.resolve({ ok: false, error: "Unknown tab: " + payload.tab });
      db[DEMO_TABS[payload.tab]] = col.filter((x) => String(x.id) !== String(payload.id));
      demoSave(db);
      return Promise.resolve({ ok: true, data: { id: payload.id } });
    }
    default: return Promise.resolve({ ok: false, error: "Unknown action: " + action });
  }
}

            ${steps.map((s) => `<li class="card"><span>${escW(s)}</span></li>`).join("")}

        <section class="wo-sec">

            ${donts.map((d) => `<li><i class="fas fa-circle-xmark"></i><span>${escW(d)}</span></li>`).join("")}

        ${notes.length ? `

          <h2><i class="fas fa-lightbulb"></i> Important notes</h2>

            <ul>${notes.map((n) => `<li>${escW(n)}</li>`).join("")}</ul>
          </div>
        </section>` : ""}
        <div class="wo-cta">
          <a href="https://muse.ai/files/1360301033830820/1719673026830966/2txrzxdrc3oqqn3g76i78ajt/Registration.html" class="btn btn-grad"><i class="fas fa-dumbbell"></i> Join Now — Start This Workout</a>
          <a href="https://muse.ai/files/1360301033830820/1872163737463658/rnxloox1wzwol1sei58xtuti/index.html#programs" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> All Programs</a>
        </div>
      </div>
    </div>`;
});

function initMiniNav() {
  const btn = document.getElementById("hamburger");
  const links = document.getElementById("navLinks");
  if (!btn || !links) return;
  btn.addEventListener("click", () => {
    const open = links.classList.toggle("open");
    btn.innerHTML = open ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
  });
  links.querySelectorAll("a").forEach((a) =>
    a.addEventListener("click", () => {
      links.classList.remove("open");
      btn.innerHTML = '<i class="fas fa-bars"></i>';
    })
  );
}
